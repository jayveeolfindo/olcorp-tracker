# Render Blueprint — creates the web service + a persistent disk for the SQLite database.
# In Render: New + → Blueprint → connect this repo. Then fill in the three "sync:false" secrets.
services:
  - type: web
    name: olcorp-tracker
    runtime: node
    plan: starter                 # $7/mo, always-on (do NOT use "free" — it sleeps)
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true              # redeploys when you push to the repo
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: DB_FILE
        value: /var/data/data.db  # lives on the persistent disk below
      - key: COOKIE_SECURE
        value: "true"             # HTTPS in production
      - key: LINK_TTL_HOURS
        value: "72"
      - key: SESSION_DAYS
        value: "75"
      - key: BASE_URL             # set to your Render URL first, then the custom domain
        sync: false
      - key: ADMIN_USER           # your consultant login — choose a value
        sync: false
      - key: ADMIN_PASS           # your consultant password — choose a STRONG value
        sync: false
      # Email (optional) — fill these only if you want client notifications / emailed links.
      # For Gmail, SMTP_USER is your address and SMTP_PASS is a Gmail App Password.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
    disk:
      name: data
      mountPath: /var/data        # SQLite file persists here across deploys/restarts
      sizeGB: 1
